<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080711" />
  <title>Neon Heart</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#080711}
    body{touch-action:none}
    .scene{position:relative;width:100%;height:100%;overflow:hidden;cursor:grab;isolation:isolate;background:radial-gradient(ellipse at 50% 48%,#260d27 0%,#110b1b 31%,#080711 72%)}
    .scene.dragging{cursor:grabbing}
    .scene:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(241,99,181,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(241,99,181,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse,#000,transparent 75%)}
    .scene:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.22;background:repeating-linear-gradient(transparent 0 3px,rgba(255,255,255,.025) 4px)}
    canvas{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:2}
    .frame{position:absolute;inset:28px;z-index:4;pointer-events:none;border:1px solid rgba(255,109,185,.08)}
    .frame:before,.frame:after,.corner:before,.corner:after{content:"";position:absolute;width:28px;height:28px;border-color:rgba(255,91,168,.6);border-style:solid}
    .frame:before{top:-1px;left:-1px;border-width:1px 0 0 1px}.frame:after{top:-1px;right:-1px;border-width:1px 1px 0 0}.corner:before{bottom:-1px;left:-1px;border-width:0 0 1px 1px}.corner:after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
    .photo{position:absolute;z-index:0;inset:0;pointer-events:none;overflow:hidden}
    .photo:before{content:"";position:absolute;inset:-36px;background:url("a-cyberpunk.jpg") center/cover no-repeat;filter:blur(28px)}
    .photo:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:min(100%,75vh);transform:translateX(-50%);background:url("a-cyberpunk.jpg") center/contain no-repeat;filter:blur(5px);mask-image:linear-gradient(to right,transparent,#000 22%,#000 78%,transparent)}
    .timer{position:absolute;z-index:5;top:6%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:5px;white-space:nowrap;pointer-events:none}
    .timer time{color:#ffd5e8;font:900 clamp(38px,5vw,72px)/1.15 'Microsoft YaHei','微软雅黑',sans-serif;letter-spacing:.025em;text-shadow:0 0 12px rgba(255,119,187,.75),0 0 35px rgba(255,47,143,.38)}
    .timer output{color:#ffd5e8;font:900 clamp(38px,5vw,72px)/1.15 'Microsoft YaHei','微软雅黑',sans-serif;letter-spacing:.025em;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(255,119,187,.75),0 0 35px rgba(255,47,143,.38)}
    @media(max-width:700px){.frame{inset:14px}.timer{top:9%;gap:8px}.timer time{font-size:clamp(32px,7.5vw,52px)}.timer output{font-size:clamp(32px,7.5vw,52px)}}

  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="可拖动旋转的动态三维爱心">
    <canvas id="heart" aria-hidden="true"></canvas><div class="frame"><div class="corner"></div></div>
    <div class="photo" role="img" aria-label="经过霓虹插画风格处理的牵手照片"></div>
    <div class="timer"><output id="elapsed" aria-live="off"></output><time datetime="2026-06-26">2026/06/26</time></div>
  </main>
<script>
(() => {
  const canvas=document.getElementById('heart'),ctx=canvas.getContext('2d'),scene=document.getElementById('scene');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let width=0,height=0,dpr=1,angle=.12,tilt=-.08,dragging=false,lastX=0,lastY=0,lastTime=0;
  const TAU=Math.PI*2,points=[],rings=[],fibers=[],dust=[];
  function outline(t){return {x:16*Math.pow(Math.sin(t),3)/17,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17-.12};}
  function surface(t,z){const p=outline(t),s=Math.sqrt(Math.max(0,1-(z/.56)**2));return {x:p.x*s,y:p.y*s,z};}
  // Cross sections and meridians form a rounded, translucent volume.
  for(let layer=0;layer<=48;layer++){
    const z=(layer/48*2-1)*.555,ring=[];
    for(let j=0;j<180;j++)ring.push(surface(j/180*TAU,z));
    rings.push(ring);
  }
  for(let i=0;i<5200;i++){
    const z=(Math.random()*2-1)*.555,p=surface(Math.random()*TAU,z);
    const inset=Math.random()<.2?.5+Math.random()*.48:1;
    points.push({x:p.x*inset,y:p.y*inset,z:p.z,size:Math.random()*1.35+.3,alpha:Math.random()*.5+.3,phase:Math.random()*TAU,cyan:Math.random()<.025});
  }
  // Curved inner strands create a denser, more intricate core.
  for(let i=0;i<28;i++){
    const strand=[],phase=i/28*TAU;
    for(let j=0;j<=100;j++){
      const t=j/100*TAU,p=outline(t),scale=.18+.62*j/100;
      strand.push({x:p.x*scale,y:p.y*scale,z:Math.sin(t*2+phase)*.19+Math.cos(phase)*.12});
    }
    fibers.push(strand);
  }
  for(let i=0;i<220;i++)dust.push({a:Math.random()*TAU,r:.9+Math.random()*.8,y:(Math.random()-.5)*.8,size:Math.random()*1.3+.3,speed:.05+Math.random()*.12,phase:Math.random()*TAU});
  const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.2,a:Math.random()*.48+.08,phase:Math.random()*TAU}));
  function resize(){const rect=scene.getBoundingClientRect();width=rect.width;height=rect.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=width*dpr;canvas.height=height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  function project(p,beat=1){
    let x=p.x*beat,y=p.y*beat,z=p.z*beat,ca=Math.cos(angle),sa=Math.sin(angle);
    const xx=x*ca+z*sa;let zz=-x*sa+z*ca,ct=Math.cos(tilt),st=Math.sin(tilt),yy=y*ct-zz*st;zz=y*st+zz*ct;
    const mobile=width<=700,perspective=3.1/(3.1-zz),unit=mobile?Math.min(width*.39,height*.29):Math.min(width*.34,height*.34);
    return {x:width*.5+xx*unit*perspective,y:height*(mobile?.60:.59)+yy*unit*perspective,z:zz,scale:perspective};
  }
  function path(points,beat,stroke,widthLine,closed=false){ctx.beginPath();points.forEach((p,i)=>{const q=project(p,beat);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});if(closed)ctx.closePath();ctx.strokeStyle=stroke;ctx.lineWidth=widthLine;ctx.stroke()}
  function draw(time){
    if(!lastTime)lastTime=time;const dt=Math.min((time-lastTime)/1000,.05);lastTime=time;if(!reduced&&!dragging)angle+=dt*.16;
    const seconds=time/1000,beat=1+(reduced?0:.028*Math.pow(Math.max(0,Math.sin(seconds*2.4)),8));ctx.clearRect(0,0,width,height);
    for(const s of stars){ctx.fillStyle=`rgba(255,160,207,${s.a*(reduced?1:.75+.25*Math.sin(seconds*.8+s.phase))})`;ctx.fillRect(s.x*width,s.y*height,s.r,s.r)}
    const radius=Math.min(width,height)*.48,glow=ctx.createRadialGradient(width/2,height*.59,0,width/2,height*.59,radius);glow.addColorStop(0,'rgba(255,30,130,.18)');glow.addColorStop(.45,'rgba(201,26,126,.075)');glow.addColorStop(1,'rgba(180,20,115,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,width,height);
    // Orbital paths and drifting sparks frame the sculpture in three dimensions.
    for(let orbit=0;orbit<3;orbit++){
      const track=[];for(let j=0;j<=160;j++){const a=j/160*TAU,r=1.12+orbit*.18;track.push({x:Math.cos(a)*r,y:Math.sin(a)*(.12+orbit*.035)+.15,z:Math.sin(a)*r*.65})}
      path(track,1,`rgba(${orbit===1?'92,235,240':'255,75,155'},${orbit===1?.08:.1})`,.7);
    }
    for(const d of dust){const a=d.a+(reduced?0:seconds*d.speed),p=project({x:Math.cos(a)*d.r,y:d.y+Math.sin(a*2+d.phase)*.06,z:Math.sin(a)*d.r*.65});ctx.beginPath();ctx.fillStyle=`rgba(255,${d.phase>4?210:95},${d.phase>4?225:170},${.18+Math.max(0,p.z)*.25})`;ctx.arc(p.x,p.y,d.size*p.scale,0,TAU);ctx.fill()}
    for(let k=2;k<rings.length-2;k+=2)path(rings[k],beat,'rgba(255,71,151,.13)',.6,true);
    for(let j=0;j<180;j+=6)path(rings.map(r=>r[j]),beat,'rgba(255,102,175,.105)',.55);
    fibers.forEach((fiber,i)=>path(fiber,beat,`rgba(${i%7===0?'106,245,244':'255,88,169'},${i%7===0?.09:.075})`,.7));
    const projected=points.map(p=>({...project(p,beat),p})).sort((a,b)=>a.z-b.z);
    for(const q of projected){const depth=q.z+.65,alpha=q.p.alpha*(.3+depth*.48),r=q.p.size*q.scale*(.65+depth*.4);ctx.beginPath();ctx.fillStyle=q.p.cyan?`rgba(139,255,250,${alpha})`:`rgba(255,${Math.round(54+depth*70)},${Math.round(130+depth*55)},${alpha})`;if(r>1.15){ctx.shadowBlur=7;ctx.shadowColor=q.p.cyan?'#6effff':'#ff1689'}else ctx.shadowBlur=0;ctx.arc(q.x,q.y,Math.max(.3,r),0,TAU);ctx.fill()}ctx.shadowBlur=0;
    requestAnimationFrame(draw);
  }
  scene.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;scene.classList.add('dragging');scene.setPointerCapture(e.pointerId)});
  scene.addEventListener('pointermove',e=>{if(!dragging)return;angle+=(e.clientX-lastX)*.008;tilt=Math.max(-.75,Math.min(.75,tilt+(e.clientY-lastY)*.006));lastX=e.clientX;lastY=e.clientY});
  function endDrag(){dragging=false;scene.classList.remove('dragging')}scene.addEventListener('pointerup',endDrag);scene.addEventListener('pointercancel',endDrag);
  const elapsed=document.getElementById('elapsed');
  function updateTimer(){
    const start=new Date(2026,5,26);let seconds=Math.floor((Date.now()-start.getTime())/1000),future=seconds<0;seconds=Math.abs(seconds);
    seconds%=86400;const hours=Math.floor(seconds/3600);seconds%=3600;const minutes=Math.floor(seconds/60);seconds%=60;
    const pad=n=>String(n).padStart(2,'0');elapsed.textContent=`${future?'− ':''}${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
  }
  updateTimer();setInterval(updateTimer,1000);
  window.addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
